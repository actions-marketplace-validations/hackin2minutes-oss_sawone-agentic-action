name: 'SawOne-Agentic: AI & Agent Security'
description: 'DevSecOps scanner for Agentic AI, MCP, LLMs, and ML systems. Auto-detects frameworks and maps to OWASP & ATLAS.'
author: 'hackin2minutes-oss'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to scan (repository root or sub-directory)'
    required: false
    default: '.'
  config:
    description: 'Path to .sawone.yml configuration file'
    required: false
    default: '.sawone.yml'
  phases:
    description: 'DevSecOps phases to execute (all, or comma-separated list of plan,code,build,test,release)'
    required: false
    default: 'all'
  severity:
    description: 'Findings at or above this level fail the gate (e.g. HIGH,CRITICAL)'
    required: false
    default: 'HIGH,CRITICAL'
  enforce:
    description: 'If true, security gate failures exit non-zero; if false, reports are generated without blocking'
    required: false
    default: 'true'
  languages:
    description: 'Report languages (comma-separated, e.g. en,ar)'
    required: false
    default: 'en,ar'
  redteam-endpoint:
    description: 'Optional live LLM endpoint you own to run adversarial red-teaming (garak + promptfoo)'
    required: false
    default: ''
  redteam-profile:
    description: 'Red-team probe profile (quick or full)'
    required: false
    default: 'quick'
  scanner-image:
    description: 'Scanner container image (tag or immutable @sha256 digest)'
    required: false
    default: 'ghcr.io/hackin2minutes-oss/sawone-si-scanner:1'

outputs:
  passed:
    description: 'true if all security gates passed, false otherwise'
    value: ${{ steps.scan.outputs.passed }}
  failed:
    description: 'Count of failed security gates'
    value: ${{ steps.scan.outputs.failed }}
  reports-dir:
    description: 'Path where generated PDF, HTML, SARIF, and JSON evidence reports are stored'
    value: ${{ steps.scan.outputs.reports-dir }}

runs:
  using: 'composite'
  steps:
    - name: Run SawOne-Agentic Security Scanner
      id: scan
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_CONFIG: ${{ inputs.config }}
        IN_PHASES: ${{ inputs.phases }}
        IN_SEVERITY: ${{ inputs.severity }}
        IN_ENFORCE: ${{ inputs.enforce }}
        IN_LANGUAGES: ${{ inputs.languages }}
        IN_ENDPOINT: ${{ inputs.redteam-endpoint }}
        IN_RT_PROFILE: ${{ inputs.redteam-profile }}
        IMAGE: ${{ inputs.scanner-image }}
      run: |
        set -uo pipefail
        target="$(realpath "${GITHUB_WORKSPACE}/${IN_PATH}")"
        reports="${target}/sawone-agentic-reports"
        mkdir -p "${reports}"

        # 1. Least Privilege Runner Isolation:
        # Only mount /var/run/docker.sock when red-teaming or container tests require it
        sock_mount=()
        if [ -n "${IN_ENDPOINT}" ] || [[ ",${IN_PHASES:-all}," == *",test,"* ]] || [ "${IN_PHASES:-all}" = "all" ]; then
          if [ -S /var/run/docker.sock ]; then
            sock_mount=("-v" "/var/run/docker.sock:/var/run/docker.sock")
          fi
        fi

        # 2. Explicit image pull (no silent failure hiding)
        echo "Verifying scanner image (${IMAGE})..."
        if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then
          echo "Pulling scanner image ${IMAGE}..."
          if ! docker pull -q "${IMAGE}"; then
            echo "::error::Failed to pull scanner image: ${IMAGE}"
            exit 2
          fi
        fi

        echo "Starting SawOne-Agentic scan across phases: ${IN_PHASES}..."
        code=0
        # 3. Mount target source as read-only (:ro); only reports directory is writable (:rw)
        docker run --rm \
          "${sock_mount[@]}" \
          -v "${target}:${target}:ro" \
          -v "${reports}:${reports}:rw" \
          -w "${target}" \
          -e SCAN_PHASES="${IN_PHASES}" \
          -e SCAN_CONFIG="${IN_CONFIG}" \
          -e SCAN_SEVERITY="${IN_SEVERITY}" \
          -e SCAN_ENFORCE="${IN_ENFORCE}" \
          -e SCAN_LANGUAGES="${IN_LANGUAGES}" \
          -e SAWONE_LLM_ENDPOINT="${IN_ENDPOINT}" \
          -e SCAN_REDTEAM_PROFILE="${IN_RT_PROFILE}" \
          -e REPO="${GITHUB_REPOSITORY:-local}" \
          -e SHA="${GITHUB_SHA:-head}" \
          -e REF="${GITHUB_REF:-refs/heads/main}" \
          -e RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-local}/actions/runs/${GITHUB_RUN_ID:-0}" \
          "${IMAGE}" --path "${target}" --reports "${reports}" || code=$?

        echo "reports-dir=${reports}" >> "$GITHUB_OUTPUT"

        if [ -f "${reports}/summary.md" ]; then
          cat "${reports}/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

        # 4. Fail-closed gate result evaluation:
        # Malformed or missing summary.json must NEVER default to passed=true
        failed=0
        if [ -f "${reports}/summary.json" ]; then
          if failed_parsed=$(jq -e '[.stages[] | select(.status == "failed")] | length' "${reports}/summary.json" 2>/dev/null); then
            failed="${failed_parsed}"
          else
            echo "::error::Could not parse summary.json; scanner report may be malformed."
            [ "${code}" -eq 0 ] && code=2
          fi
        else
          if [ "${code}" -eq 0 ]; then
            echo "::error::summary.json was not generated by the scanner."
            code=2
          fi
        fi

        echo "failed=${failed}" >> "$GITHUB_OUTPUT"
        echo "passed=$([ "${code}" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

        # 5. Distinguish clean scan, security gate failure, and scanner error
        if [ "${code}" -ne 0 ]; then
          if [ "${code}" -eq 1 ]; then
            echo "::error::SawOne-Agentic security gates failed (${failed} blocking finding(s))."
            [ "${IN_ENFORCE}" = "true" ] && exit 1
          else
            echo "::error::SawOne-Agentic scanner error / execution failure (exit code ${code})."
            exit "${code}"
          fi
        fi
